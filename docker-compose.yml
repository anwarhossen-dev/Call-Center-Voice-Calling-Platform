version: '3.8'

services:
  # 1. Microsoft SQL Server (Transactional Database)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cc_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped

  # 2. Redis (Sub-millisecond Agent Presence & ACD Queue Locks)
  redis:
    image: redis:7-alpine
    container_name: cc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 3. RabbitMQ (Decoupled Asynchronous Event Bus)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cc_rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  # 4. MinIO S3 (Encrypted Call Recordings Object Storage)
  minio:
    image: minio/minio:latest
    container_name: cc_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # 5. FreeSWITCH Telephony & WebRTC Media Gateway
  freeswitch:
    image: safarov/freeswitch:latest
    container_name: cc_freeswitch
    network_mode: "host" # Crucial: Bypasses Docker NAT for low-jitter voice RTP
    volumes:
      - ./telephony/freeswitch/conf:/etc/freeswitch
      - ./recordings:/recordings
    restart: unless-stopped

volumes:
  sql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
